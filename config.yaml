# config.yaml - Configuration for Multi-Type Food Flow Prediction using GNNs
#
# This version describes the multi-task model in `code/` (MT-LocalizedGCN),
# which predicts all seven SCTG food commodity categories with a single network.
# The previous single-task configuration is archived at `legacy/config.yaml`.

# Project information
project:
  name: "Multi-Type Food Flow Prediction"
  description: "Predicting FAF-zone and cross-scale county food flows for SCTG 01-07 with MT-LocalizedGCN, a single multi-task GNN"
  version: "2.0.0"

# Environment and dependencies
environment:
  python_version: "3.9"
  dependencies:
    - numpy
    - pandas
    - scikit-learn
    - scipy
    - torch
    - torch-geometric

# Data paths and configuration
data:
  # Shapefiles are only needed for visualization and now live in the separate
  # portal repository: https://github.com/ICICLE-ai/GNNFoodFlowPortal
  shapefiles:
    repo: "https://github.com/ICICLE-ai/GNNFoodFlowPortal"
    county: "data/shapefiles/cb_2017_us_county_500k/cb_2017_us_county_500k.shp"
    state: "data/shapefiles/cb_2018_us_state_20m/cb_2018_us_state_20m.shp"
    FAF_zones: "data/shapefiles/2017_CFS_Metro_Areas_with_FAF/2017_CFS_Metro_Areas_with_FAF.shp"

  trade_data:
    # One directed OD flow file per SCTG commodity category (01-07)
    SCTG_paths:
      - "code/data/FAF5_SCTG1.csv"
      - "code/data/FAF5_SCTG2.csv"
      - "code/data/FAF5_SCTG3.csv"
      - "code/data/FAF5_SCTG4.csv"
      - "code/data/FAF5_SCTG5.csv"
      - "code/data/FAF5_SCTG6.csv"
      - "code/data/FAF5_SCTG7.csv"

  economic_indicators:
    faf_path: "code/data/faf_features_aligned_filtered.csv"
    county_path: "code/data/county_aligned_filtered.csv"

  distance_matrix:
    path: "code/data/FAF_distance_matrix.csv"

  # County cross-scale inference artifacts (PCA basis, edge scaler, index maps)
  artifacts:
    path: "code/artifacts/"

# Feature engineering configuration
features:
  node_features:
    pca_components: 30          # --n_pca
  edge_features:
    - "distance"
    - "dms_mode"
    - "dist_band"

# Model configuration (multi-task)
model:
  name: "localized_gcn"        # MTLocalizedGCN (default); MTEdgeMLP baseline available
  hidden_channels: 128         # --hidden
  dropout: 0.2                 # --dropout
  knn_k: 5                     # distance-kNN graph, --knn_k
  learning_rate: 0.001         # --lr
  num_tasks: 7                 # one hurdle head per SCTG category (01-07)

# Hurdle model configuration (per-task)
hurdle_model:
  # Each SCTG task has its own hurdle head: classification (trade presence)
  # + regression (trade magnitude), sharing one GCN backbone.
  positive_class_weighting: true   # disable with --no_pos_weight
  regression:
    metrics: ["cpc", "mae", "rmse", "r2"]

# Training configuration
training:
  epochs: 1000                 # --epochs
  train_ratio: 0.70            # --train_ratio
  val_ratio: 0.15              # --val_ratio (remaining 0.15 is test)
  edge_universe: "all_pairs"   # all directed non-self FAF OD pairs
  selection_metric: "mean_cpc" # validation checkpoint selection
  edge_scaling: "train_only"
  random_seed: 42

# Evaluation metrics
evaluation:
  classification_metrics:
    - "accuracy"
    - "precision"
    - "roc_auc"
  regression_metrics:
    - "cpc"
    - "mae"
    - "rmse"
    - "r2"

modelFeatures:
  - Single multi-task GNN predicting SCTG 01-07 simultaneously
  - Distance-kNN localized GCN backbone (MT-LocalizedGCN)
  - Seven task-specific hurdle heads for zero-inflated regression
  - FAF-to-county cross-scale transfer inference
  - Train-only edge feature scaling
